{% extends 'sender/base.html' %}

{% block page_title %}Регистрация нового пользователя{% endblock %}

{% block content %}
<div class="text-center">
    <p class="fs-3">Управление почтовыми рассылками </p>
</div>
<div class="container">
    <div class="row justify-content-center">
        <div class="card m-3" style="width: 40rem;  background-color: rgba(0,0,0,0.2);">
            <div class="card-body">
                <h4 style="margin-top: 10px; text-align: center ">Пользователь :</h4>
                <!--Форма для обработки POST-запроса-->
                <form method="post" enctype="multipart/form-data" action="" class="form-container">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                    <div class="btn-group" role="group" aria-label="Basic outlined example">
                        <button type="submit" class="btn btn-outline-secondary">Регистрация</button>
                        <a href="{% url 'sender:home' %}" class="btn btn-outline-secondary">Отменить</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


{% endblock %}
