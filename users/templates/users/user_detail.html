{% extends 'sender/base.html' %}

{% block page_title %}Информация о пользователе{% endblock %}

<!-- {% load users_tags %} -->
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card ">
                    <div class="card-body">
                        <img src="{{ object.avatar|user_media_filter }}" alt="Фото" class="rounded" width="100"
                             height="100">
                        <h2 class="card-text">{{ object.email }}</h2>
                        <p class="card-text">Телефон: {{ object.phone }}</p>
                        <p class="card-text">Страна: {{ object.country }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'users:update' user.pk%}" role="button">Редактировать</a>

                                <a class="btn btn-primary" href="{% url 'sender:home' %}"
                                   role="button" style="margin-left: 5px;">Назад</a>
                                {% if user.is_superuser %}
                                <a class="btn btn-danger" href="{% url 'users:delete' user.pk%}"
                                   role="button" style="margin-left: 5px;">Удалить</a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
